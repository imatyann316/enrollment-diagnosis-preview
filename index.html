<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あなたのチームは、仲間を巻き込めている？｜3分診断</title>
<meta name="description" content="7つの質問で、いまのチームづくりを見つめ直す3分診断。結果にあわせて無料3日間チャレンジプログラムをご案内します。">
<style>
  :root{--ink:#17231f;--muted:#62716a;--paper:#f7f4ec;--line:#d5d8d0;--forest:#174b3d;--lime:#d8ee6a;--orange:#ff6d3a;--white:#fffdfa;--shadow:0 16px 42px rgba(18,52,42,.14)}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.7}
  .shell{min-height:100svh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(circle at 82% 10%,#e6f6a5 0 8%,transparent 8.2%),radial-gradient(circle at 9% 89%,#ffd4b9 0 11%,transparent 11.2%),var(--paper)}
  .app{width:min(680px,100%)}
  .brand{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--forest);font-size:13px;font-weight:800;letter-spacing:.08em}.brand i{width:12px;height:12px;display:block;background:var(--orange);border-radius:50% 50% 50% 3px;transform:rotate(-45deg)}
  .panel{background:var(--white);border:1px solid rgba(23,75,61,.13);box-shadow:var(--shadow);padding:clamp(26px,6vw,54px);overflow:hidden;position:relative}.panel:after{content:"";position:absolute;right:-75px;top:-75px;width:175px;height:175px;border-radius:50%;border:28px solid rgba(216,238,106,.5);pointer-events:none}
  h1,h2,p{margin:0} h1{font-size:clamp(31px,7.5vw,52px);line-height:1.22;letter-spacing:-.04em;position:relative;z-index:1} h1 em{font-style:normal;color:var(--forest);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:.23em;text-underline-offset:-.08em}
  .lead{margin-top:22px;color:var(--muted);font-size:16px;max-width:490px}.note{margin-top:18px;font-size:12px;color:var(--muted)}
  button,.cta{font:inherit;border:0;cursor:pointer}.start,.next,.cta{min-height:56px;padding:14px 22px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}.start,.next{background:var(--forest);color:#fff;margin-top:30px}.start:hover,.next:hover{background:#0c3529}.start span,.next span{font-size:22px;line-height:0}.flow{display:none}.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:30px}.progress-text{font-size:13px;font-weight:800;color:var(--forest);white-space:nowrap}.progress{height:6px;background:#e6e7de;flex:1}.progress i{display:block;height:100%;width:14.3%;background:var(--lime);transition:width .3s ease}
  .question{font-size:clamp(23px,5vw,34px);line-height:1.38;letter-spacing:-.03em}.question small{display:block;margin-bottom:11px;color:var(--orange);font-size:12px;letter-spacing:.1em}.answers{display:grid;gap:10px;margin-top:28px}.answer{width:100%;padding:17px 18px;border:1px solid var(--line);background:#fff;text-align:left;color:var(--ink);font-weight:700;line-height:1.45;transition:.18s}.answer:hover,.answer:focus{border-color:var(--forest);transform:translateX(3px);outline:3px solid rgba(216,238,106,.45)}.answer.selected{background:#edf8dc;border-color:var(--forest);box-shadow:inset 5px 0 var(--forest)}.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:23px}.back{background:transparent;color:var(--muted);text-decoration:underline;padding:10px 0;font-size:14px}.next:disabled{opacity:.38;cursor:not-allowed}
  .result{display:none}.eyebrow{color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.12em}.result h2{margin-top:8px;font-size:clamp(30px,7vw,47px);line-height:1.24;letter-spacing:-.045em}.result .summary{margin-top:18px;color:var(--muted);font-size:16px}.result-box{margin:28px 0 20px;padding:22px;background:#eff7dc;border-top:5px solid var(--forest)}.result-box strong{font-size:18px;display:block;line-height:1.5}.result-box p{margin-top:7px;font-size:14px}.cta{background:var(--orange);color:#fff;width:100%;margin-top:14px;font-size:16px}.cta:hover{background:#e55728}.restart{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:underline;background:none;width:100%;padding:8px}
  .legal{font-size:11px;color:var(--muted);margin-top:19px}.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:480px){.panel{padding:29px 22px}.shell{padding:12px}.answer{padding:15px}.next{min-width:112px}}
</style>
</head>
<body>
<main class="shell"><div class="app">
  <div class="brand"><i></i> ENROLLMENT 3DAYS / SELF CHECK</div>
  <section class="panel" aria-live="polite">
    <div id="intro">
      <h1>あなたのチームは、<br><em>仲間を巻き込めている？</em></h1>
      <p class="lead">「もっと仲間が自走してくれたら」<br>そんな組織づくりの現在地を、7つの質問で整理する3分診断です。</p>
      <button class="start" type="button" onclick="begin()">診断をはじめる <span>→</span></button>
      <p class="note">※医療・心理の診断ではありません。いまのチームづくりを見つめるためのセルフチェックです。</p>
    </div>
    <div class="flow" id="flow">
      <div class="progress-wrap"><div class="progress-text" id="count">1 / 7</div><div class="progress"><i id="bar"></i></div></div>
      <div id="questionArea"></div>
      <div class="nav"><button class="back" type="button" onclick="prev()">← 戻る</button><button class="next" id="next" type="button" onclick="next()" disabled>次へ →</button></div>
    </div>
    <div class="result" id="result"></div>
  </section>
</div></main>
<script>
const questions=[
 ['いま、成果や判断が<br>「自分ひとり」に寄っていると感じる？',['ほとんど感じない','ときどき感じる','かなり感じる','いつも自分が抱えている']],
 ['仲間が「やらされる」のではなく、<br>自分から動く場面はある？',['自然に動いている','一部の人は動く','こちらが促せば動く','ほとんど自発的には動かない']],
 ['事業やプロジェクトへの想いを、<br>仲間に言葉で渡せている？',['十分に渡せている','ときどき伝えている','伝えたいが言語化できていない','日々の業務で精一杯']],
 ['任せるとき、「期待通りにならないかも」と<br>不安になりやすい？',['ほとんど不安はない','少し不安になる','かなり不安になる','結局、自分でやってしまう']],
 ['仲間が増えても、組織が回る未来を<br>具体的に想像できる？',['はっきり想像できる','なんとなく想像できる','まだ曖昧','まったく想像できない']],
 ['いまのやり方を変えてでも、<br>チームの可能性を広げたい？',['今のままで満足している','少し気になっている','本気で変えたい','今すぐ変えるきっかけがほしい']],
 ['12/1・3・5の夜、<br>仲間を巻き込む力を学ぶ時間を取れそう？',['難しそう','1日なら参加できそう','2日なら参加できそう','3日間とも参加したい']]
];
let index=0, answers=[];
function begin(){document.getElementById('intro').style.display='none';document.getElementById('flow').style.display='block';render();}
function render(){const [q,opts]=questions[index];document.getElementById('count').textContent=`${index+1} / ${questions.length}`;document.getElementById('bar').style.width=`${((index+1)/questions.length)*100}%`;let html=`<div class="fade"><div class="question"><small>QUESTION ${String(index+1).padStart(2,'0')}</small>${q}</div><div class="answers">`;opts.forEach((o,i)=>html+=`<button class="answer ${answers[index]===i?'selected':''}" type="button" onclick="selectAnswer(${i})">${o}</button>`);html+='</div></div>';document.getElementById('questionArea').innerHTML=html;document.getElementById('next').disabled=answers[index]===undefined;document.querySelector('.back').style.visibility=index===0?'hidden':'visible';document.getElementById('next').textContent=index===questions.length-1?'結果を見る →':'次へ →';}
function selectAnswer(n){answers[index]=n;render();}
function next(){if(answers[index]===undefined)return;if(index<questions.length-1){index++;render()}else showResult()}
function prev(){if(index>0){index--;render()}}
function showResult(){const score=answers.reduce((a,b)=>a+b,0);let title,body,point;if(score>=17){title='いまこそ、<br>仲間を動かす設計を。';body='あなたは「一人で頑張る組織」から抜け出し、仲間と事業を前に進める転換点にいます。気合いや管理だけでなく、人が自ら関わりたくなる言葉と場のつくり方を学ぶタイミングです。';point='3日間で、巻き込み・意思決定・自走する組織づくりを体感しよう。'}else if(score>=9){title='チームの可能性を<br>次の段階へ。';body='すでにチームには力があります。次は、その力を一部の人だけに頼らず、もっと広げること。仲間の当事者意識を育てるヒントを持ち帰ってください。';point='「任せる」と「巻き込む」の違いを、3日間で整理しよう。'}else{title='もっと自然に、<br>仲間が動く組織へ。';body='いまのチームには、すでに良い土台がありそうです。だからこそ、成長の節目で必要になる「想いを共有し、仲間が自ら動く」仕組みを先に知っておく価値があります。';point='次の成長に備えるための、無料3日間チャレンジ。'}
 document.getElementById('flow').style.display='none';document.getElementById('result').innerHTML=`<div class="fade"><p class="eyebrow">YOUR RESULT</p><h2>${title}</h2><p class="summary">${body}</p><div class="result-box"><strong>${point}</strong><p>細野貴史「エンロールメント」3日間無料チャレンジプログラム<br>12/1・12/3・12/5｜ライブ配信</p></div><a class="cta" href="https://pro.form-mailer.jp/fms/ca0142ec357850" target="_blank" rel="noopener">無料で3日間に申し込む →</a><button class="restart" type="button" onclick="restart()">もう一度診断する</button><p class="legal">※この診断は、回答内容を外部へ送信しません。</p></div>`;document.getElementById('result').style.display='block';}
function restart(){index=0;answers=[];document.getElementById('result').style.display='none';document.getElementById('intro').style.display='block';}
</script>
</body></html>
